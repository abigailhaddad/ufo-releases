name: Extract PDF text

# Runs after refresh-csv finishes successfully OR on manual dispatch.
# Uses OPENAI_API_KEY (already set as a repo secret) + a multimodal model
# to transcribe each new PDF/IMG into data/text/<id>.txt and commits.
on:
  workflow_run:
    workflows: ["Refresh UFO records"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Re-extract even if cached"
        required: false
        default: "false"
      limit:
        description: "Cap records this run (blank = no cap)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: extract-text
  cancel-in-progress: false

jobs:
  extract:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350  # GH max is 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pdftoppm
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Extract text
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE: ${{ inputs.force == 'true' && '1' || '' }}
          LIMIT: ${{ inputs.limit }}
          RECORD_CONCURRENCY: "4"
          CONCURRENCY: "4"
        run: pnpm exec tsx scripts/extract-text.ts

      - name: Verify data integrity
        run: pnpm verify:data

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/records.json data/text/; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/records.json data/text/
          git commit -m "data: extract PDF text ($(date -u +%Y-%m-%d))"
          git push
