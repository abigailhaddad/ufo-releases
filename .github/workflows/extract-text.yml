name: Extract + verify + publish

# Runs after refresh-csv finishes successfully, but only when that refresh
# actually changed data/records.json — see the `gate` job. Picks up any new
# records the CSV refresh added, downloads them, extracts text, verifies
# integrity, mirrors to R2, then builds and publishes the static export to
# Cloudflare Pages so the live site updates.
#
# Skipping is safe for publishing: deploy.yml rebuilds and deploys on every
# push to main, so a refresh that commits still reaches the live site.
on:
  workflow_run:
    workflows: ["Refresh UFO records"]
    types: [completed]
  # Safety net. The gate below skips this pipeline on days the refresh found no
  # new records, which means a record stuck on a retryable failure (Gemini 429,
  # say) would otherwise wait for the next new record to get another attempt.
  # Once a week it runs regardless so that backlog always drains.
  schedule:
    - cron: "30 15 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-extract even if cached"
        required: false
        default: "false"
      limit:
        description: "Cap records this run (blank = no cap)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: extract-pipeline
  cancel-in-progress: false

jobs:
  # The expensive pipeline below costs over an hour of runner time (Gemini
  # extraction + the R2 mirror), and it used to run every single day purely
  # because the refresh workflow completed — not because there was anything new
  # to extract. This decides whether that work has a reason to happen.
  gate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - id: decide
        env:
          # Where main sat when the refresh started. Its data commit, if it made
          # one, lands after this — so diffing it against main isolates exactly
          # what that refresh changed.
          BEFORE: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "Manual or scheduled run — not gating."
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Cannot resolve $BEFORE — running rather than silently skipping."
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if git diff --quiet "$BEFORE" HEAD -- data/records.json; then
            echo "records.json unchanged since $BEFORE — nothing to extract."
            echo "run=false" >> $GITHUB_OUTPUT
          else
            echo "records.json changed since $BEFORE:"
            git diff --stat "$BEFORE" HEAD -- data/records.json
            echo "run=true" >> $GITHUB_OUTPUT
          fi

  pipeline:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Full history: this job commits and pushes back to main, and a
          # shallow clone makes that push fail once the branch has moved on.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install system deps (poppler for pdftotext + pdftoppm)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Pre-download new PDFs (idempotent)
        run: pnpm download:pdfs

      - name: Collapse rename-pair dupes (content-hash aware)
        run: pnpm dedup

      - name: Pre-download new images + videos (idempotent)
        run: pnpm download:media

      - name: Extract via pdftotext where possible (free)
        run: pnpm extract:text
        env:
          PDFTOTEXT_ONLY: "1"

      - name: Extract remaining scans via Gemini
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          FORCE: ${{ inputs.force == 'true' && '1' || '' }}
          LIMIT: ${{ inputs.limit }}
          RECORD_CONCURRENCY: "2"
          CONCURRENCY: "4"
        run: pnpm extract:gemini

      - name: Verify data integrity (refuses to commit on regression)
        run: pnpm verify:data

      - name: Type-check + build (catches schema/UI regressions)
        run: pnpm build

      - name: E2E tests (gates publish)
        run: pnpm test:e2e
        env:
          CI: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Mirror to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — skipping R2 upload"
            exit 0
          fi
          pnpm upload:r2

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/records.json data/text/; then
            echo "No changes."
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/records.json data/text/
          git commit -m "data: extract pipeline ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> $GITHUB_OUTPUT

      # There was a "Promote main → prod" step here (fast-forward `main` onto
      # `prod`). It is gone on purpose. `prod` now exists only to feed the
      # retained Vercel project, which is a redirect stub that forwards the old
      # ufo-releases.vercel.app hostname to ufo-releases.abigailhaddad.com — so
      # continuously promoting pipeline data onto it serves no purpose. The live
      # site deploys from `main` via Cloudflare Pages, in the steps below.
      #
      # The branch is deliberately kept. Do not delete `prod`, and do not remove
      # vercel.json — that stub is the only thing keeping the legacy .vercel.app
      # URL alive.

      # Vercel watched the prod branch and built on push, which is what actually
      # published the data this pipeline produces. Cloudflare Pages is a direct
      # upload, so publishing has to be an explicit step or the refreshed data
      # lands in git and never reaches the site.
      #
      # Unconditional, not gated on steps.commit.outputs.changed: the upstream
      # "Refresh UFO records" job may have committed new records even when the
      # extraction pass adds nothing, and this is the last job in the chain.
      #
      # The build must run here rather than uploading a directory — the site is
      # a Next.js static export, and `prebuild` regenerates the sharded search
      # index from data/ before next build writes out/.
      - name: Build the static export
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy out --project-name=ufo-releases --branch=main --commit-dirty=true
