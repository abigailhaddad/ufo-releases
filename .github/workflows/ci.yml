name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify data integrity
        run: pnpm verify:data

      - name: Lint
        run: pnpm lint

      - name: Type-check + build
        run: pnpm build

      # `pnpm build` already runs this, but as its own step the failure reads
      # as "a file is too big for the host" rather than "the build broke".
      # Cloudflare Pages hard-rejects the whole deploy on any file >= 25 MiB.
      - name: Check no published file exceeds the host's 25 MiB limit
        run: pnpm check:size

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
        env:
          CI: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
