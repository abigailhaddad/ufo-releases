name: Deploy to Cloudflare Pages

# Why this exists alongside the deploy step in extract-text.yml:
#
#   * This covers HUMAN pushes. Vercel built from the prod branch on push;
#     Cloudflare Pages direct upload publishes nothing on its own, so without
#     this, editing the site and pushing would leave it unpublished until the
#     next scheduled data refresh.
#   * extract-text.yml still needs its own deploy step to cover the BOT push.
#     GitHub deliberately does not fire workflows for commits pushed with the
#     built-in GITHUB_TOKEN, so the pipeline's data commit can never trigger
#     this workflow.
#
# Deleting either one leaves a path that silently stops publishing.

on:
  push:
    branches: [main]
  workflow_dispatch:

# A push landing while a deploy is in flight should supersede it, not race it.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      # `prebuild` regenerates the sharded search index from data/, and `build`
      # runs check:size, which fails if any file in out/ passes the Cloudflare
      # Pages 25 MiB per-file limit. That gate is why this builds rather than
      # uploading a prebuilt directory.
      - name: Build the static export
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy out --project-name=ufo-releases --branch=main --commit-dirty=true
