name: Refresh UFO records

on:
  schedule:
    # Daily at 13:30 UTC (~9:30 ET) — after typical morning press releases.
    - cron: "30 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-csv
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Fetch CSV and merge into records.json
        run: pnpm fetch:csv

      - name: Verify data integrity
        run: pnpm verify:data

      - name: Type-check + build
        run: pnpm build

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/records.json data/uap-csv.csv; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/records.json data/uap-csv.csv
          git commit -m "data: refresh UFO records from war.gov ($(date -u +%Y-%m-%d))"
          git push
